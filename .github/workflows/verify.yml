name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -noEmit -skipLibCheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          path: |
            main.js
            manifest.json
            styles.css

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Cache Obsidian binaries
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-${{ hashFiles('manifest.json') }}
          restore-keys: obsidian-

      - name: Setup virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb herbstluftwm
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1
          DISPLAY=:99 herbstluftwm &
          sleep 1
        env:
          DISPLAY: ':99'

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DISPLAY: ':99'
