name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # Everything that runs npm (and so dependency install scripts) happens here,
  # with a read-only token and no persisted git credentials.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true

      # A tag that disagrees with manifest.json would publish a release whose
      # assets Obsidian resolves under the wrong version.
      - name: Tag matches manifest version
        run: |
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          if [ "$MANIFEST_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run tsc
      - run: npm run test:coverage
      - run: npm run build

      - name: Bundle size check
        run: |
          SIZE=$(stat -c%s main.js)
          echo "Bundle size: ${SIZE} bytes"
          if [ "$SIZE" -gt 512000 ]; then
            echo "::error::main.js exceeds the 500KB budget"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            main.js
            manifest.json
            styles.css

  # Signs a build provenance attestation for the built files. It runs no
  # project code, so no dependency install script can reach its OIDC token.
  # Artifact attestations need a public repository on this plan. Verify a
  # download with: gh attestation verify main.js --repo Papersync/obsidian-papersync
  attest:
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ !github.event.repository.private }}
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

  # Only this job can write, and it runs no project code: it attaches the built
  # files to a draft release with the GitHub CLI (Obsidian's documented pattern).
  publish:
    runs-on: ubuntu-24.04
    # Waits for the attestation when it runs; while the repository is private
    # that job is skipped, which must not skip the release.
    needs: [build, attest]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.attest.result != 'failure' }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets

      # Idempotent: a re-run (or a re-pushed tag) refreshes the assets of the
      # existing draft instead of failing or creating a second draft.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release upload "$GITHUB_REF_NAME" main.js manifest.json styles.css --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
